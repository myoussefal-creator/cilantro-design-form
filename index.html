<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cilantro Store Requirements</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Segoe UI",Arial,sans-serif}
[hidden]{display:none!important}


:root{
  --ink:#4a2f22; --body:#2f1c13; --muted:#6b5b4e; --line:#e2d9ce; --label:#faf3ea; --auto:#f4f1ea;
  --bg:#f6f1ea; --card:#ffffff; --accent:#5f7d47; --link:#1f5fa8; --red:#b03a2e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--body);font:15px/1.45 "Segoe UI",Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 80px}
h1{color:var(--ink);font-size:22px;margin:4px 0 2px;text-align:center;letter-spacing:.3px}
.sub{color:var(--muted);text-align:center;font-style:italic;font-size:13px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
.bar{color:#fff;border-radius:8px 8px 0 0;padding:10px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bar small{font-weight:400;font-style:italic;opacity:.9}
.sec{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:18px 0;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(180px,38%) 1fr;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.lab{background:var(--label);padding:10px 12px;font-weight:600;color:var(--ink);font-size:14px}
.val{padding:8px 12px;min-width:0}
input[type=text],input[type=date],input[type=password],textarea{width:100%;font:inherit;padding:7px 9px;border:1px solid #cfc3b5;border-radius:6px;background:#fffdf9;color:var(--body)}
textarea{min-height:58px;resize:vertical}
input:focus,textarea:focus{outline:2px solid #c9a27e;border-color:#c9a27e}
.opts{display:flex;flex-wrap:wrap;gap:6px 8px}
.opt{display:inline-flex;align-items:center;gap:6px;border:1px solid #d6cabc;border-radius:18px;padding:4px 11px 4px 8px;cursor:pointer;user-select:none;background:#fff;font-size:14px}
.opt input{width:17px;height:17px;accent-color:var(--accent);margin:0;cursor:pointer}
.opt.on{background:#eef4e8;border-color:var(--accent);font-weight:600}
.extra{margin-top:7px;font-size:13px;color:var(--muted);font-style:italic}
.extra input{margin-top:3px;font-style:normal}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;padding:10px 12px}
.qtab{width:100%;border-collapse:collapse}
.qtab td,.qtab th{border-top:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left;font-size:14px}
.qtab th{background:#4f6b57;color:#fff;font-size:13px}
.qtab td.n{width:36px;text-align:center;font-weight:700;color:var(--ink);background:var(--label)}
.qtab td.c{width:44px;text-align:center}
.qtab input{width:19px;height:19px;accent-color:var(--accent);cursor:pointer}
.ar{direction:rtl;text-align:right;color:var(--muted);font-size:14px;margin-top:3px;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 18px;font-size:14px}
.info b{color:var(--ink);display:block;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.howto{background:#f3f7ef;border:1px solid #d5e2c9}
.howto ol{margin:6px 0 0 18px;padding:0}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;background:var(--ink);color:#fff}
.btn.sec2{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.btn.green{background:var(--accent)}
.btn.small{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.status{position:fixed;right:16px;bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.status.err{color:var(--red);border-color:var(--red)}
.banner{border-radius:8px;padding:12px 14px;margin:12px 0;font-weight:600}
.banner.ok{background:#eef4e8;border:1px solid var(--accent);color:#3d5a2c}
.banner.err{background:#fbeceb;border:1px solid var(--red);color:var(--red)}
.submitbox{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
.submitbox label{flex:1;min-width:220px;font-weight:600;color:var(--ink);font-size:14px}
/* summary */
table.sum{width:100%;border-collapse:collapse;background:#fff}
table.sum th{background:var(--muted);color:#fff;text-align:left;padding:8px 10px;font-size:13px}
table.sum td{border-top:1px solid var(--line);padding:7px 10px;font-size:14px;vertical-align:top}
table.sum td.req{background:var(--label);width:34%}
table.sum td.v{background:var(--auto)}
table.sum td.src{width:110px;text-align:center;font-style:italic;font-size:12px}
table.sum tr.grp td{background:#ede6dc;font-weight:700;font-size:12px;letter-spacing:.4px;text-transform:uppercase}
.pill{display:inline-block;margin:1px 6px 1px 0;white-space:nowrap}
.pill.off{color:#a5998e}
.pill.on{font-weight:700;color:var(--body)}
.empty{color:#a5998e}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border-radius:12px;padding:3px 9px;border:1px solid var(--line);background:#fff}
.chip.done{background:#eef4e8;border-color:var(--accent);color:#3d5a2c;font-weight:600}
.chip.wip{background:#fff7e6;border-color:#e0b35a;color:#8a5d00}
.links{width:100%;border-collapse:collapse;margin-top:10px}
.links td{border-top:1px solid var(--line);padding:7px 6px;font-size:14px;vertical-align:middle}
.links td:last-child{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.center{text-align:center}
@media (max-width:640px){
  .row{grid-template-columns:1fr}
  .lab{padding-bottom:4px}
  table.sum td.src{width:70px}
  .links td:last-child{white-space:normal}
}
@media print{
  body{background:#fff}
  .noprint,.status{display:none!important}
  .sec,.card{break-inside:avoid-page}
  tr{break-inside:avoid}
}

.grid.seats{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.opt.seatcard{flex-direction:column;align-items:stretch;border-radius:10px;padding:6px 6px 8px;gap:6px}
.opt.seatcard svg{display:block;width:100%;height:auto;border-radius:8px}
.opt.seatcard span{display:flex;align-items:center;gap:6px;justify-content:center;text-align:center}
.opt.seatcard.on{box-shadow:0 0 0 2px var(--accent)}
.seatsum{display:flex;flex-wrap:wrap;gap:8px}
.seatsum figure{margin:0;width:120px;font-size:12px;text-align:center}
.seatsum svg{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--line)}
@media print{.seatsum figure{width:100px}}

:root{color-scheme:light}
body{background:var(--bg);color:var(--body)}
.wrap{padding-inline:16px}
.deps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.dep{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:12px 14px;cursor:pointer;font:inherit;color:var(--body)}
.dep:hover,.dep:focus-visible{border-color:var(--c);box-shadow:0 2px 10px rgba(74,47,34,.12);outline:none}
.dep b{color:var(--c);font-size:16px}
.dep span{color:var(--link);font-weight:600;font-size:13px}
.back{background:none;border:0;color:var(--link);font:inherit;font-weight:600;cursor:pointer;padding:4px 0}
.msg{white-space:pre-wrap;word-break:break-all;background:#fbf8f3;border:1px dashed #cdbfae;border-radius:6px;padding:10px;font:12px/1.4 Consolas,monospace;max-height:140px;overflow:auto;color:var(--body)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.actions a{text-decoration:none;display:inline-block}
.pmhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.step{font-weight:700;color:var(--ink);margin:0 0 6px}
.note{font-size:13px;color:var(--muted)}
.sumwrap{overflow-x:auto}
:focus-visible{outline:2px solid #c9a27e;outline-offset:2px}
</style>
</head>

egal"}, "lg_permit": {"type": "choice", "key": "lg_permit", "label": "Fit-out Permit Status:", "opts": ["Issued", "In Progress", "Not Started", "N/A"], "extra": null, "short": "Fit-out Permit Status", "grid": false, "sec": "legal"}, "lg_cd": {"type": "choice", "key": "lg_cd", "label": "Civil Defense Approval Required:", "opts": ["Yes", "No"], "extra": ["lg_cd_req", "Special requirements"], "short": "Civil Defense Approval", "grid": false, "sec": "legal"}, "lg_meter": {"type": "choice", "key": "lg_meter", "label": "Utility Metering:", "opts": ["Separate Meters", "Shared with Landlord", "Not Sure"], "extra": null, "short": "Utility Metering", "grid": false, "sec": "legal"}, "lg_signpermit": {"type": "choice", "key": "lg_signpermit", "label": "Signage / Advertising Permit Required:", "opts": ["Yes", "No"], "extra": null, "short": "Signage / Advertising Permit", "grid": false, "sec": "legal"}, "lg_music": {"type": "choice", "key": "lg_music", "label": "Music / Performance License Required:", "opts": ["Yes", "No"], "extra": null, "short": "Music / Performance License", "grid": false, "sec": "legal"}, "lg_outdoor": {"type": "choice", "key": "lg_outdoor", "label": "Outdoor Seating Permit Required:", "opts": ["Yes", "No"], "extra": null, "short": "Outdoor Seating Permit", "grid": false, "sec": "legal"}, "lg_ins": {"type": "text", "key": "lg_ins", "label": "Insurance Requirements:", "short": "Insurance Requirements", "ml": true, "sec": "legal"}, "lg_affect": {"type": "choice", "key": "lg_affect", "label": "Permits Affecting Design or Fit-Out:", "opts": ["Yes", "No"], "extra": ["lg_affect_det", "If yes - specify"], "short": "Permits Affecting Design / Fit-Out", "grid": false, "sec": "legal"}, "lg_notes": {"type": "text", "key": "lg_notes", "label": "Notes:", "short": "Legal Notes", "ml": true, "sec": "legal"}, "qr01": {"type": "req", "key": "qr01", "en": "Entrance doors must be equipped with effective air curtains aligned with the door height.", "ar": "يجب أن تكون أبواب المداخل مزودة بستائر هوائية فعّالة تتناسب مع ارتفاع الباب وتكون بمحاذاته مباشرة.", "to": "AB", "sec": "qa", "short": "Entrance doors must be equipped with effective air curtains aligned with the door height.", "on": true}, "qr02": {"type": "req", "key": "qr02", "en": "Entrance doors must have self-closing mechanisms to prevent full opening.", "ar": "يجب أن تكون أبواب المداخل مزودة بآليات إغلاق ذاتي لمنع فتح الباب بشكل كامل.", "to": "A", "sec": "qa", "short": "Entrance doors must have self-closing mechanisms to prevent full opening.", "on": true}, "qr03": {"type": "req", "key": "qr03", "en": "Doors and windows must be well sealed to prevent the entry of rodents, pests, or stray animals, and door bottom seals must be installed.", "ar": "يجب أن تكون الأبواب والنوافذ محكمة الإغلاق لمنع دخول القوارض أو الآفات أو الحيوانات الضالة، مع توفير سدّات سفلية للأبواب.", "to": "A", "sec": "qa", "short": "Doors and windows must be well sealed to prevent the entry of rodents, pests, or stray animals, and door bottom seals must be installed.", "on": true}, "qr04": {"type": "req", "key": "qr04", "en": "The site level must be higher than street level to prevent wastewater backflow, or a mechanism must be provided to prevent this.", "ar": "يجب أن يكون منسوب الموقع أعلى من منسوب الشارع لضمان عدم رجوع مياه الصرف، أو توفير آلية تصريف تمنع ذلك.", "to": "AB", "sec": "qa", "short": "The site level must be higher than street level to prevent wastewater backflow, or a mechanism must be provided to prevent this.", "on": true}, "qr05": {"type": "req", "key": "qr05", "en": "Wall-to-floor joints in counter areas, storage areas, and any room with drainage must be concave to prevent dirt accumulation.", "ar": "يجب أن تكون الوصلات بين الجدران والأرضيات ذات شكل مقعّر لمنع تراكم الأوساخ والملوثات في مناطق الكاونتر والتخزين وأي غرفة تحتوي على نقطة تصريف.", "to": "A", "sec": "qa", "short": "Wall-to-floor joints in counter areas, storage areas, and any room with drainage must be concave to prevent dirt accumulation.", "on": true}, "qr06": {"type": "req", "key": "qr06", "en": "All drainage points must have internal sieves, proper covers, non-return valves, and must be easily accessible for cleaning and maintenance.", "ar": "يجب أن تحتوي جميع نقاط الصرف على غرابيل داخلية وأغطية مناسبة وصمامات عدم الرجوع مع سهولة الوصول إليها لأعمال التنظيف والصيانة.", "to": "B", "sec": "qa", "short": "All drainage points must have internal sieves, proper covers, non-return valves, and must be easily accessible for cleaning and maintenance.", "on": true}, "qr07": {"type": "req", "key": "qr07", "en": "Walls in enclosed areas must be well sealed to prevent entry of pests.", "ar": "يجب أن تكون الجدران في المناطق المغلقة محكمة العزل لمنع دخول الآفات.", "to": "A", "sec": "qa", "short": "Walls in enclosed areas must be well sealed to prevent entry of pests.", "on": true}, "qr08": {"type": "req", "key": "qr08", "en": "All openings in walls, drains, and around pipes must be sealed to prevent entry of insects or rodents.", "ar": "يجب سد جميع الفتحات في الجدران أو حول المصارف والمواسير لمنع دخول الحشرات والقوارض.", "to": "AB", "sec": "qa", "short": "All openings in walls, drains, and around pipes must be sealed to prevent entry of insects or rodents.", "on": true}, "qr09": {"type": "req", "key": "qr09", "en": "A hand-washing sink with hot water must be available at the counter area.", "ar": "يجب توفير مغسلة لغسيل الأيدي في منطقة الكاونتر مزودة بماء ساخن.", "to": "AB", "sec": "qa", "short": "A hand-washing sink with hot water must be available at the counter area.", "on": true}, "qr10": {"type": "req", "key": "qr10", "en": "Hand-washing sinks in bathrooms must include soap, sanitizer, paper towels, automatic-closing trash bins, and hot water (≥38°C).", "ar": "يجب توفير مغسلة أيدي في الحمامات مع صابون ومعقم ومناديل وسلة نفايات بإغلاق تلقائي وماء ساخن بدرجة لا تقل عن 38°C.", "to": "AB", "sec": "qa", "short": "Hand-washing sinks in bathrooms must include soap, sanitizer, paper towels, automatic-closing trash bins, and hot water (≥38°C).", "on": true}, "qr11": {"type": "req", "key": "qr11", "en": "A dedicated sink must be provided for cleaning hygiene tools, with enough space to store cleaning equipment. One combined sink may serve both purposes if adequate.", "ar": "يجب توفير حوض مخصص لغسيل أدوات النظافة وبمساحة كافية لحفظ أدوات التنظيف، ويمكن أن يكون حوضًا واحدًا يخدم الغرضين.", "to": "AB", "sec": "qa", "short": "A dedicated sink must be provided for cleaning hygiene tools, with enough space to store cleaning equipment. One combined sink may serve both purposes if adequate.", "on": true}, "qr12": {"type": "req", "key": "qr12", "en": "Water heaters must be installed in all branches.", "ar": "يجب تركيب سخان مياه في جميع الفروع.", "to": "B", "sec": "qa", "short": "Water heaters must be installed in all branches.", "on": true}, "qr13": {"type": "req", "key": "qr13", "en": "Water filters must be installed on all water sources inside the branch.", "ar": "يجب تركيب فلاتر مياه على جميع مصادر المياه داخل الفرع.", "to": "B", "sec": "qa", "short": "Water filters must be installed on all water sources inside the branch.", "on": true}, "qr14": {"type": "req", "key": "qr14", "en": "Air conditioners must maintain internal temperature at a maximum of 25°C, especially near open display fridges.", "ar": "يجب أن تحافظ أجهزة التكييف على درجة حرارة لا تتجاوز 25°C خصوصًا قرب ثلاجات العرض المفتوحة.", "to": "B", "sec": "qa", "short": "Air conditioners must maintain internal temperature at a maximum of 25°C, especially near open display fridges.", "on": true}, "qr15": {"type": "req", "key": "qr15", "en": "Storage areas must be well ventilated with temperature maintained below 28°C.", "ar": "يجب أن تكون مناطق التخزين جيدة التهوية مع الحفاظ على درجة حرارة أقل من 28°C.", "to": "B", "sec": "qa", "short": "Storage areas must be well ventilated with temperature maintained below 28°C.", "on": true}, "qr16": {"type": "req", "key": "qr16", "en": "Adequate ventilation space must be provided around display fridges, closed fridges, and freezers.", "ar": "يجب توفير مساحة تهوية مناسبة حول ثلاجات العرض والثلاجات المغلقة والفريزرات لضمان عملها بشكل صحيح.", "to": "A", "sec": "qa", "short": "Adequate ventilation space must be provided around display fridges, closed fridges, and freezers.", "on": true}, "qr17": {"type": "req", "key": "qr17", "en": "Open display fridges must not be exposed to direct sunlight.", "ar": "يجب عدم تعريض ثلاجات العرض المفتوحة لأشعة الشمس المباشرة.", "to": "A", "sec": "qa", "short": "Open display fridges must not be exposed to direct sunlight.", "on": true}, "qr18": {"type": "req", "key": "qr18", "en": "Electrical outlets for fly traps must be installed at a height of 170 cm, with locations determined by the Quality team and pest control provider.", "ar": "يجب تركيب مقابس كهرباء على ارتفاع 170 سم لتشغيل مصائد الذباب، ويتم تحديد مواقعها من قبل فريق الجودة وشركة مكافحة الآفات.", "to": "B", "sec": "qa", "short": "Electrical outlets for fly traps must be installed at a height of 170 cm, with locations determined by the Quality team and pest control provider.", "on": true}, "qr19": {"type": "req", "key": "qr19", "en": "All electrical panels and sockets must be covered.", "ar": "يجب تغطية جميع اللوحات الكهربائية والمقابس.", "to": "B", "sec": "qa", "short": "All electrical panels and sockets must be covered.", "on": true}, "qr20": {"type": "req", "key": "qr20", "en": "A clearance of at least 5 cm must be provided around any machine installed within or under the counter.", "ar": "يجب توفير فراغ لا يقل عن 5 سم حول أي آلة مركّبة داخل أو أسفل الكاونتر لتسهيل التنظيف والصيانة.", "to": "A", "sec": "qa", "short": "A clearance of at least 5 cm must be provided around any machine installed within or under the counter.", "on": true}, "qr21": {"type": "req", "key": "qr21", "en": "Corners and spaces beneath cabinets must be easily accessible for cleaning.", "ar": "يجب أن تكون زوايا الموقع وما تحت الخزائن سهلة الوصول للتنظيف.", "to": "A", "sec": "qa", "short": "Corners and spaces beneath cabinets must be easily accessible for cleaning.", "on": true}, "qr22": {"type": "req", "key": "qr22", "en": "A designated staff room with lockers for personal belongings (and eating area if possible) must be provided.", "ar": "يجب توفير غرفة مخصصة للموظفين تحتوي على خزائن لحفظ الأغراض الشخصية (ومكان للأكل إن أمكن).", "to": "A", "sec": "qa", "short": "A designated staff room with lockers for personal belongings (and eating area if possible) must be provided.", "on": true}, "qr23": {"type": "req", "key": "qr23", "en": "A designated cabinet for storing cleaning chemicals and tools must be provided, away from food and beverages.", "ar": "يجب توفير خزانة مخصصة لحفظ أدوات ومواد التنظيف بعيدًا عن الأغذية والمشروبات.", "to": "A", "sec": "qa", "short": "A designated cabinet for storing cleaning chemicals and tools must be provided, away from food and beverages.", "on": true}, "qr24": {"type": "req", "key": "qr24", "en": "A first aid kit must be available for minor injuries.", "ar": "يجب توفير صندوق إسعافات أولية لمعالجة الإصابات البسيطة.", "to": "A", "sec": "qa", "short": "A first aid kit must be available for minor injuries.", "on": true}, "qr25": {"type": "req", "key": "qr25", "en": "Bathrooms must not open directly into food storage, preparation, handling, or service areas, nor into packaging areas.", "ar": "يجب ألا تُفتح الحمامات مباشرة على مناطق التخزين أو التحضير أو المناولة أو تقديم الأغذية والمشروبات أو مواد التغليف.", "to": "A", "sec": "qa", "short": "Bathrooms must not open directly into food storage, preparation, handling, or service areas, nor into packaging areas.", "on": true}, "qr26": {"type": "req", "key": "qr26", "en": "The smoking area must be fully isolated from the counter to prevent product contamination.", "ar": "يجب أن تكون منطقة التدخين معزولة بالكامل عن منطقة الكاونتر لمنع تلوث المنتجات بالدخان.", "to": "A", "sec": "qa", "short": "The smoking area must be fully isolated from the counter to prevent product contamination.", "on": true}, "qr27": {"type": "req", "key": "qr27", "en": "Food trucks must have fully enclosed front facades, with dedicated windows for payment and order delivery, and air curtains or plastic curtains must be installed when windows are open.", "ar": "يجب إغلاق واجهات عربات الطعام المتنقلة بالكامل وتخصيص شباك للدفع وشباك للتسليم مع تركيب ستائر هواء أو ستائر بلاستيكية عند فتحها.", "to": "AB", "sec": "qa", "short": "Food trucks must have fully enclosed front facades, with dedicated windows for payment and order delivery, and air curtains or plastic curtains must be installed when windows are open.", "on": false}, "qr28": {"type": "req", "key": "qr28", "en": "Metal mesh screens must be installed on exhaust fans to prevent the entry of insects or rodents.", "ar": "تركيب شبك معدني على الشفاطات لمنع دخول الحشرات أو القوارض.", "to": "B", "sec": "qa", "short": "Metal mesh screens must be installed on exhaust fans to prevent the entry of insects or rodents.", "on": true}, "qr29": {"type": "req", "key": "qr29", "en": "A splash guard must be installed on the hand-washing sink to isolate it from the rest of the counter area and equipment.", "ar": "تركيب حاجز رذاذ (Splash Guard) على حوض غسيل الأيدي لعزله عن باقي منطقة الكاونتر والمعدات.", "to": "A", "sec": "qa", "short": "A splash guard must be installed on the hand-washing sink to isolate it from the rest of the counter area and equipment.", "on": true}, "qr30": {"type": "req", "key": "qr30", "en": "Sufficient foot-pedal operated waste bins must be provided in the branch.", "ar": "توفير أماكن كافية للمخلفات في الفرع تعمل بنظام الفتح بالقدم.", "to": "A", "sec": "qa", "short": "Sufficient foot-pedal operated waste bins must be provided in the branch.", "on": true}, "mn_roci": {"type": "choice", "key": "mn_roci", "label": "Equipment List (ROCI) Attached", "opts": ["Yes", "No"], "extra": null, "short": "Equipment List (ROCI) Attached", "grid": false, "sec": "manual"}}, "A": [["Project", ["br_name", "br_code", "br_location", "br_typ /* ---------- message encoding ---------- */
function allowedKeys(d){
  const keys = new Set();
  const s = SPEC.sections.find(x => x.code === d);
  for (const k of s.fields){ const f = F(k);
    if (f.type === "choice") f.opts.forEach(o => keys.add(`${k}_${slug(o)}`)); else keys.add(k);
    if (f.extra) keys.add(f.extra[0]); }
  if (d === "qa") SPEC.qa_reqs.forEach(k => keys.add(k));
  return keys;
}
function encode(d, draft){
  const v = {};
  for (const [k, val] of Object.entries(draft.values || {})){
    const f = F(k);
    if (f && f.type === "req"){ if (!!val !== !!f.on) v[k] = val ? 1 : 0; continue; }
    if (val === true) v[k] = 1; else if (typeof val === "string" && val.trim()) v[k] = val.trim();
  }
  const payload = {d, br: draft.branch || "", by: draft.by || "", at: Date.now(), v};
  return "CIL1~" + LZString.compressToEncodedURIComponent(JSON.stringify(payload)) + "~END";
}
function decodeAll(text){
  const out = [];
  const re = /CIL1~([\s\S]*?)(?:~END|\n\s*\n|$)/g; let m;
  const src = text.replace(/\r/g, "");
  while ((m = re.exec(src))){
    try {
      const code = m[1].replace(/[^A-Za-z0-9+\-$_]/g, "");
      const p = JSON.parse(LZString.decompressFromEncodedURIComponent(code));
      if (!p || !DEPTS.includes(p.d)) continue;
      const ok = allowedKeys(p.d), values = {};
      for (const [k, val] of Object.entries(p.v || {})){
        if (!ok.has(k)) continue;
        const f = F(k);
        if (f && f.type === "req") values[k] = !!val;
        else if (val === 1 || val === true) values[k] = true;
        else if (typeof val === "string") values[k] = val.slice(0, 4000);
      }
      out.push({d: p.d, branch: String(p.br || "").slice(0, 120), by: String(p.by || "").slice(0, 120), at: +p.at || Date.now(), values});
    } catch {}
  }
  return out;
}

function presetFromHash(){
  try {
    if (!location.hash.startsWith("#b=")) return null;
    const p = JSON.parse(LZString.decompressFromEncodedURIComponent(location.hash.slice(3)));
    if (!p || typeof p.branch !== "string" || typeof p.values !== "object") return null;
    const ok = allowedKeys("branch"), values = {};
    for (const [k, v] of Object.entries(p.values)) if (ok.has(k) && (v === true || typeof v === "string")) values[k] = typeof v === "string" ? v.slice(0, 500) : v;
    return {branch: p.branch.slice(0, 120), values, at: p.at};
  } catch { return null; }
}
if (!PRESET) PRESET = presetFromHash();
function answersFromHash(){
  if (!location.hash.startsWith("#a=")) return null;
  const found = decodeAll("CIL1~" + location.hash.slice(3) + "~END");
  return found.length ? found : null;
}
function branchLink(branch, values){
  const v = {}; for (const [k, val] of Object.entries(values)) if (val === true || (typeof val === "string" && val.trim())) v[k] = val;
  return location.origin + location.pathname + "#b=" + LZString.compressToEncodedURIComponent(JSON.stringify({branch, values: v, at: Date.now()}));
}


/* ---------- shared folder (Chrome / Edge "pick the folder once") ---------- */
const CAN_FOLDER = typeof window.showDirectoryPicker === "function";
function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open("cilantro_fs", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("handles");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function handleGet(key){
  try { const db = await idb(); return await new Promise((res) => {
    const q = db.transaction("handles").objectStore("handles").get(key);
    q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch { return null; }
}
async function handleSet(key, h){
  try { const db = await idb(); db.transaction("handles", "readwrite").objectStore("handles").put(h, key); } catch {}
}
async function folderHandle(key, {ask} = {}){
  let h = await handleGet(key);
  if (h){
    let perm = await h.queryPermission({mode: key === "out" ? "readwrite" : "read"}).catch(() => "denied");
    if (perm !== "granted" && ask) perm = await h.requestPermission({mode: key === "out" ? "readwrite" : "read"}).catch(() => "denied");
    if (perm === "granted") return h;
  }
  if (!ask) return null;
  try { h = await window.showDirectoryPicker({id: "cilantro_" + key, mode: key === "out" ? "readwrite" : "read"}); }
  catch { return null; }
  await handleSet(key, h);
  return h;
}
async function writeToFolder(h, name, text){
  const fh = await h.getFileHandle(name, {create: true});
  const w = await fh.createWritable(); await w.write(text); await w.close();
  return name;
}

      <button class="dep" style="--c:${col(d)}" data-go="${d}"><b>${NAMES[d]}</b><span>▶ Click here to go to your questions</span></button>`).join("")}
    </div>
    <div class="card" style="margin-top:26px;background:#fbf8f3">
      <div class="pmhead"><div><b style="color:var(--ink)">For the PM only</b><div class="note">Branch details, and building the consolidated Sections A & B from the answers you receive.</div></div>
      <div class="actions" style="margin:0"><button class="btn sec2 small" data-go="branch">Branch Identification</button><button class="btn green small" data-go="share">① Send to departments</button><button class="btn small" data-go="pm">② PM – Consolidated A & B</button></div></div>
    </div>`;
}

/* ---------- department form ---------- */
function deptPage(d){
  const key = "cil_draft_" + d + (PRESET ? "_" + slug(PRESET.branch) : "");
  const draft = load(key, {values:{}, by:"", branch:""});
  const values = draft.values;
  $app.innerHTML = `
    <button class="back noprint" data-go="home">← All departments</button>
    <h1>CILANTRO – STORE REQUIREMENTS FORM</h1>
    <div class="sub">${esc(NAMES[d])} section</div>
    <div class="card"><label for="branch" style="font-weight:600;color:var(--ink)">Branch name <span class="note">(as written in the PM's message)</span></label>
      <input type="text" id="branch" placeholder="e.g. Cilantro Mall of Egypt"></div>
    <div id="form">${renderSection(d, values)}</div>
    <div class="card" id="sendcard">
      <label for="by" style="font-weight:600;color:var(--ink)">Your name</label>
      <input type="text" id="by" placeholder="Type your name">
      <div class="actions"><button class="btn green" id="send">Send my answers to the PM</button></div>
      <div id="sendout"></div>
      <p class="note" style="margin:10px 0 0">Your answers are kept on this device until you send them – you can close the page and come back.</p>
    </div>`;
  const $form = document.getElementById("form");
  fillInputs($form, values);
  const $by = document.getElementById("by"), $br = document.getElementById("branch");
  $by.value = draft.by || ""; $br.value = draft.branch || "";
  if (PRESET){ $br.value = PRESET.branch; draft.branch = PRESET.branch; $br.readOnly = true; $br.style.background = "var(--auto)";
    $br.insertAdjacentHTML("afterend", `<div class="note" style="margin-top:6px">🔒 Set by the PM for this branch.</div>`); }
  let t = null;
  const persist = () => { clearTimeout(t); t = setTimeout(() => { draft.by = $by.value; draft.branch = $br.value; setStatus(save(key, draft) ? "Saved on this device ✓" : ""); }, 500); };
  $by.addEventListener("input", persist); $br.addEventListener("input", persist);
  $form.addEventListener("input", e => { const el = e.target; if (!el.dataset.k || el.type === "checkbox") return; values[el.dataset.k] = el.value; persist(); });
  $form.addEventListener("change", e => {
    const el = e.target; if (!el.dataset.k || el.type !== "checkbox") return;
    const g = el.dataset.g;
    if (g && el.checked && !MULTI.has(g)){
      $form.querySelectorAll(`input[data-g="${g}"]`).forEach(o => { if (o !== el && o.checked){ o.checked = false; values[o.dataset.k] = false; o.closest(".opt").classList.remove("on"); } });
    }
    values[el.dataset.k] = el.checked;
    const lab = el.closest(".opt"); if (lab) lab.classList.toggle("on", el.checked);
    persist();
  });
  document.getElementById("send").addEventListener("click", () => {
    const out = document.getElementById("sendout");
    if (!$br.value.trim() || !$by.value.trim()){
      out.innerHTML = `<div class="banner err">Please write the branch name (top of the page) and your name first.</div>`;
      (!$br.value.trim() ? $br : $by).focus(); return;
    }
    draft.by = $by.value.trim(); draft.branch = $br.value.trim(); save(key, draft);
    if (d === "branch" && !values.br_name) values.br_name = draft.branch;
    if (d === "branch"){
      addToPM([{d, branch: draft.branch, by: draft.by, at: Date.now(), values: {...values}}]);
      out.innerHTML = `<div class="banner ok">Branch details saved. Now create the ${HOSTED ? "link" : "file"} you will send to the departments – the branch details will be filled in and locked for them.</div>
        <div class="actions">${HOSTED ? `<button class="btn green" id="mklink">🔗 Create link for departments</button>` : ""}
        ${CAN_DOWNLOAD ? `<button class="btn ${HOSTED ? "sec2" : "green"}" id="mkfile">⬇ Create file for departments</button>` : ""}
        <button class="btn sec2" data-go="share">Next: Send to departments</button><button class="btn sec2" data-go="pm">PM – Consolidated A & B</button></div>
        <p class="note" id="mknote"></p>`;
      const ml = document.getElementById("mklink");
      if (ml) ml.onclick = () => {
        const link = branchLink(draft.branch, values);
        const links = load("cil_links", {}); links[draft.branch] = link; save("cil_links", links);
        const msg = groupText(draft.branch, "");
        document.getElementById("mknote").innerHTML = `<b>Link for ${esc(draft.branch)}</b> (branch details locked):
          <div class="msg" style="margin-top:6px">${esc(link)}</div>
          <div class="actions"><button class="btn sec2 small" id="cplink">Copy link</button>
          <a class="btn green small" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}">WhatsApp to departments</a>
          <a class="btn small" target="_blank" rel="noopener" href="mailto:?subject=${encodeURIComponent("Cilantro Store Requirements – " + draft.branch)}&body=${encodeURIComponent(msg)}">Email to departments</a></div>`;
        document.getElementById("cplink").onclick = async e => { try { await navigator.clipboard.writeText(link); e.target.textContent = "Copied ✓"; } catch { prompt("Copy this link:", link); } };
      };
      const mk = document.getElementById("mkfile");
      if (mk) mk.onclick = () => { const name = downloadBranchFile(draft.branch, {...values});
        document.getElementById("mknote").innerHTML = `Saved to your <b>Downloads</b> folder as <b>${esc(name)}</b>. Attach this file when you send the form to the departments.`; };
      out.scrollIntoView({behavior:"smooth", block:"center"});
      return;
    }
    const code = encode(d, draft);
    const replyLink = HOSTED ? location.origin + location.pathname + "#a=" + code.replace(/^CIL1~|~END$/g, "") : "";
    const msg = replyLink
      ? `Cilantro Store Requirements\nBranch: ${draft.branch}\nDepartment: ${NAMES[d]}\nFilled by: ${draft.by}\n\nMy answers (open this link to add them):\n${replyLink}`
      : `Cilantro Store Requirements\nBranch: ${draft.branch}\nDepartment: ${NAMES[d]}\nFilled by: ${draft.by}\n\n${code}`;
    const subject = `Cilantro Store Requirements – ${draft.branch} – ${NAMES[d]}`;
    out.innerHTML = `<div class="banner ok">Your answers are ready. Send them to the PM with one of the buttons below.${replyLink ? " The PM only has to click the link – nothing to copy or paste." : ""}</div>
      <div class="msg" id="msgtext">${esc(msg)}</div>
      <div class="actions">
        <a class="btn green" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}">Send by WhatsApp</a>
        <a class="btn" target="_blank" rel="noopener" href="mailto:${PM_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(msg)}">Send by email</a>
        <button class="btn sec2" id="copy">Copy message</button>
        ${CAN_FOLDER ? `<button class="btn green" id="tofolder">📁 Save into the shared folder</button>` : ""}
        ${CAN_DOWNLOAD ? `<button class="btn sec2" id="savefile">⬇ Save answer file</button>` : ""}</div>
      <p class="note" id="savenote"></p>
      <p class="note">If a button does not open, click <b>Copy message</b> and paste it into WhatsApp or an email to ${PM_EMAIL}.</p>`;
    const fileName = `Answers_${slug(draft.branch)}_${slug(NAMES[d])}.txt`;
    const tf = document.getElementById("tofolder");
    if (tf) tf.onclick = async () => {
      const note = document.getElementById("savenote");
      note.textContent = "Choose the shared folder…";
      const h = await folderHandle("out", {ask: true});
      if (!h){ note.innerHTML = `Folder not chosen. You can use <b>⬇ Save answer file</b> instead, then move the file yourself.`; return; }
      try { await writeToFolder(h, fileName, msg);
        note.innerHTML = `✓ Saved as <b>${esc(fileName)}</b> in the shared folder <b>${esc(h.name)}</b>. Nothing else to send – just tell the PM you are done.`; }
      catch (e){ note.innerHTML = `Could not write to that folder (${esc(e.message || "no permission")}). Use <b>⬇ Save answer file</b> instead.`; }
    };
    const sf = document.getElementById("savefile");
    if (sf) sf.onclick = () => {
      const fn = `Answers_${slug(draft.branch)}_${slug(NAMES[d])}.txt`;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([msg], {type: "text/plain"})); a.download = fn;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      document.getElementById("savenote").innerHTML = `Saved as <b>${esc(fn)}</b> in your Downloads folder. Move it into the shared folder the PM gave you (or attach it to an email).`;
    };
    document.getElementById("copy").onclick = async (ev) => {
      try { await navigator.clipboard.writeText(msg); ev.target.textContent = "Copied ✓"; }
      catch { const r = document.createRange(); r.selectNodeContents(document.getElementById("msgtext")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); ev.target.textContent = "Selected – press Ctrl+C"; }
    };
    out.scrollIntoView({behavior:"smooth", block:"center"});
  });
  if (d === "branch") document.getElementById("send").textContent = "Save branch details";
}

/* ---------- PM: consolidated ---------- */
function addToPM(list){
  const pm = load("cil_pm", {answers:{}});
  for (const a of list){ pm.answers[a.d] = a; if (a.d === "branch" || !pm.branch) pm.branch = a.branch || pm.branch; }
  save("cil_pm", pm);
  return pm;
}
function pmPage(flash){
  const pm = load("cil_pm", {answers:{}});
  const ans = pm.answers;
  const chips = DEPTS.map(d => { const a = ans[d];
    return `<span class="chip ${a ? "done" : ""}" title="${a ? "Received " + fmtDate(a.at) + (a.by ? " from " + esc(a.by) : "") : "Not received yet"}">${a ? "✓" : "–"} ${NAMES[d]}</span>`; }).join("");
  const names = [...new Set(Object.values(ans).map(a => (a.branch || "").trim().toLowerCase()).filter(Boolean))];
  const warn = names.length > 1 ? `<div class="banner err">Answers here come from different branch names (${names.map(esc).join(", ")}). Check that every department filled the same branch.</div>` : "";
  $app.innerHTML = `
    <button class="back noprint" data-go="home">← Home</button>
    <h1>CILANTRO – CONSOLIDATED REQUIREMENTS</h1>
    <div class="sub">${esc(pm.branch || "No branch yet")} · built from the departments' answers · read-only</div>
    ${flash || ""}${warn}
    <div class="card noprint">
      <p class="step">Answers from the departments</p>
      <p class="note" style="margin:-2px 0 8px">Easiest: <b>📁 Read the shared folder</b> – pick the branch folder once and every department's answers are read in one click. Other ways: <b>click the link</b> a department sends you · <b>📂 Open answer files</b> to pick their saved files from the shared folder (you can select all of them at once) · or paste a message below.</p>
      <textarea id="paste" placeholder="Paste the whole WhatsApp or email message here (you can paste several messages at once)"></textarea>
      <div class="actions"><button class="btn green" id="add">Add answers</button>
        ${CAN_FOLDER ? `<button class="btn sec2" id="readfolder">📁 Read the shared folder</button>` : ""}
        <label class="btn sec2" for="pickfiles" style="display:inline-block">📂 Open answer files</label>
        <input type="file" id="pickfiles" accept=".txt,.html,.htm,.eml,text/plain" multiple hidden>
        <button class="btn sec2 small" data-go="branch">Fill Branch Identification</button>
        <button class="btn sec2 small" data-go="share">Send to departments</button>
        <button class="btn small" id="print">Print / Save as PDF</button>
        <button class="btn sec2 small" id="clear" style="margin-left:auto">Start a new branch</button></div>
      <div style="margin-top:12px"><b style="color:var(--ink)">Received</b> <span class="note">(✓ received · – waiting)</span><div class="chips" style="margin-top:6px">${chips}</div></div>
    </div>
    <div class="sumwrap">${summaryTable("A. ARCHITECTURE DESIGN HOUSE REQUIREMENTS", col("A"), SPEC.A, ans, "the architecture design house")}</div>
    <div class="sumwrap">${summaryTable("B. MEP REQUIREMENTS", col("B"), SPEC.B, ans, "the MEP consultant / contractor")}</div>`;
  document.getElementById("add").onclick = () => {
    const found = decodeAll(document.getElementById("paste").value);
    if (!found.length){ pmPage(`<div class="banner err">No answers found in that text. Paste the whole message, including the line that starts with CIL1~ and ends with ~END.</div>`); return; }
    addToPM(found);
    pmPage(`<div class="banner ok">Added: ${found.map(a => esc(NAMES[a.d]) + (a.by ? " (" + esc(a.by) + ")" : "")).join(", ")}. Sections A & B are updated below.</div>`);
  };
  const rf = document.getElementById("readfolder");
  if (rf) rf.onclick = async () => {
    rf.textContent = "Choosing folder…";
    const h = await folderHandle("in", {ask: true});
    rf.textContent = "📁 Read the shared folder";
    if (!h){ pmPage(`<div class="banner err">No folder chosen.</div>`); return; }
    const texts = [];
    try { for await (const [name, entry] of h.entries()){
      if (entry.kind !== "file" || !/^Answers_.*\.txt$/i.test(name)) continue;
      texts.push(await (await entry.getFile()).text());
    } } catch (e){ pmPage(`<div class="banner err">Could not read that folder (${esc(e.message || "no permission")}).</div>`); return; }
    if (!texts.length){ pmPage(`<div class="banner err">No answer files found in <b>${esc(h.name)}</b>. The departments' files must be named Answers_….txt</div>`); return; }
    const found = decodeAll(texts.join("\n\n"));
    if (!found.length){ pmPage(`<div class="banner err">Found ${texts.length} file(s) in <b>${esc(h.name)}</b> but no answers inside them.</div>`); return; }
    addToPM(found);
    pmPage(`<div class="banner ok">Read <b>${esc(h.name)}</b>: ${found.map(a => esc(NAMES[a.d]) + (a.by ? " (" + esc(a.by) + ")" : "")).join(", ")}. Sections A & B are updated below.</div>`);
  };
  document.getElementById("pickfiles").onchange = async (ev) => {
    const files = [...ev.target.files]; if (!files.length) return;
    const texts = await Promise.all(files.map(f => f.text().catch(() => "")));
    const found = decodeAll(texts.join("\n\n"));
    if (!found.length){ pmPage(`<div class="banner err">No answers found in ${files.length} file(s). Open one of them and check it contains the line starting with CIL1~.</div>`); return; }
    addToPM(found);
    pmPage(`<div class="banner ok">Added from ${files.length} file(s): ${found.map(a => esc(NAMES[a.d]) + (a.by ? " (" + esc(a.by) + ")" : "")).join(", ")}. Sections A & B are updated below.</div>`);
  };
  document.getElementById("print").onclick = () => window.print();
  document.getElementById("clear").onclick = (ev) => {
    if (ev.target.dataset.sure !== "1"){ ev.target.dataset.sure = "1"; ev.target.textContent = "Click again to clear all answers"; return; }
    save("cil_pm", {answers:{}}); try { localStorage.removeItem("cil_draft_branch"); } catch {} pmPage(`<div class="banner ok">Cleared. Ready for a new branch.</div>`);
  };
}


/* ---------- PM: send invitations ---------- */
const IS_FILE = location.protocol === "file:";
const FORM_LINK = /^https?:$/.test(location.protocol) && !/claudeusercontent|claude\.ai/.test(location.host)
  ? location.origin + location.pathname
  : (IS_FILE ? "" : "https://claude.ai/artifact/6A32ksmjA4V67kLzBYJfct");
const openStep = branch => {
  const bl = HOSTED ? (load("cil_links", {})[branch] || "") : "";
  if (bl) return `1) Open this link: ${bl}`;
  return FORM_LINK ? `1) Open this link: ${FORM_LINK}` : `1) Open the attached file "${branchFileName(branch)}" (double-click it)`;
};
function downloadBranchFile(branch, values){
  const preset = {branch, values, at: Date.now()};
  const marker = "let PRESET" + " = null;";
  const html = SRC_HTML.replace(marker, () => "const PRESET = " + JSON.stringify(preset).replace(/</g, "\\u003c") + ";");
  const name = branchFileName(branch);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([html], {type: "text/html"})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  return name;
}
function inviteText(d, branch, due){
  return `Dear ${NAMES[d]} team,\n\nPlease fill in your section of the Cilantro Store Requirements Form for:\nBranch: ${branch}${due ? `\nPlease reply by: ${due}` : ""}\n\n${openStep(branch)}\n2) Click "${NAMES[d]}"\n3) Fill in your answers, then click "Send my answers to the PM".\n\nThank you,\nMohamed – PM`;
}
function groupText(branch, due){
  return `Dear all,\n\nPlease fill in your department's section of the Cilantro Store Requirements Form for:\nBranch: ${branch}${due ? `\nPlease reply by: ${due}` : ""}\n\n${openStep(branch)}\n2) Click your department's name\n3) Fill in your answers, then click "Send my answers to the PM".\n\nDepartments: ${DEPTS.filter(d => d !== "branch").map(d => NAMES[d]).join(", ")}.\n\nThank you,\nMohamed – PM`;
}
function sharePage(){
  const pm = load("cil_pm", {answers:{}});
  const st = load("cil_share", {branch: pm.branch || "", due: ""});
  $app.innerHTML = `
    <button class="back noprint" data-go="home">← Home</button>
    <h1>SEND THE FORM TO THE DEPARTMENTS</h1>
    <div class="sub">One link for everyone – each person clicks their own department</div>
    <div class="card">
      <label for="sbranch" style="font-weight:600;color:var(--ink)">Branch name</label>
      <input type="text" id="sbranch" placeholder="e.g. Cilantro Mall of Egypt">
      <label for="sdue" style="font-weight:600;color:var(--ink);display:block;margin-top:10px">Reply by <span class="note">(optional)</span></label>
      <input type="text" id="sdue" placeholder="e.g. Thursday 25 Sept">
    </div>
    <div class="card" style="border:2px solid var(--accent)">
      <p class="step">Fastest: one message to a WhatsApp group or one email to everyone</p>
      <div class="actions"><a class="btn green" id="g_wa" target="_blank" rel="noopener">WhatsApp (choose group)</a>
        <a class="btn" id="g_mail" target="_blank" rel="noopener">Email to all</a>
        <button class="btn sec2" id="g_copy">Copy message</button></div>
      <div class="msg" id="g_msg" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <p class="step">Or send to each department separately</p>
      <table class="links">${DEPTS.filter(d => d !== "branch").map(d => `<tr><td><b style="color:${col(d)}">${NAMES[d]}</b></td><td>
        <a class="btn green small" data-wa="${d}" target="_blank" rel="noopener">WhatsApp</a>
        <a class="btn sec2 small" data-mail="${d}" target="_blank" rel="noopener">Email</a>
        <button class="btn sec2 small" data-cp="${d}">Copy</button></td></tr>`).join("")}</table>
    </div>
    <p class="note" id="sharenote"></p>`;
  const $b = document.getElementById("sbranch"), $d = document.getElementById("sdue");
  $b.value = st.branch; $d.value = st.due;
  const refresh = () => {
    const branch = $b.value.trim() || "(branch name)", due = $d.value.trim();
    save("cil_share", {branch: $b.value, due: $d.value});
    const g = groupText(branch, due), subj = `Cilantro Store Requirements – ${branch}`;
    document.getElementById("g_msg").textContent = g;
    document.getElementById("g_wa").href = "https://wa.me/?text=" + encodeURIComponent(g);
    document.getElementById("g_mail").href = `mailto:?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(g)}`;
    $app.querySelectorAll("[data-wa]").forEach(a => a.href = "https://wa.me/?text=" + encodeURIComponent(inviteText(a.dataset.wa, branch, due)));
    $app.querySelectorAll("[data-mail]").forEach(a => a.href = `mailto:?subject=${encodeURIComponent(subj + " – " + NAMES[a.dataset.mail])}&body=${encodeURIComponent(inviteText(a.dataset.mail, branch, due))}`);
  };
  const note = () => { document.getElementById("sharenote").innerHTML = IS_FILE
      ? `Attach the branch file <b>${esc(branchFileName($b.value.trim()))}</b> (made in <b>Branch Identification → Create file for departments</b>) to your email / WhatsApp message.`
      : "Everyone uses the same link: <b>" + esc(FORM_LINK) + "</b>"; };
  $b.addEventListener("input", note); note();
  $b.addEventListener("input", refresh); $d.addEventListener("input", refresh); refresh();
  const copy = async (btn, text) => {
    try { await navigator.clipboard.writeText(text); btn.textContent = "Copied ✓"; }
    catch { prompt("Copy this message:", text); }
    setTimeout(() => btn.textContent = btn.id === "g_copy" ? "Copy message" : "Copy", 1500);
  };
  document.getElementById("g_copy").onclick = e => copy(e.target, document.getElementById("g_msg").textContent);
  $app.querySelectorAll("[data-cp]").forEach(b => b.onclick = () => copy(b, inviteText(b.dataset.cp, $b.value.trim() || "(branch name)", $d.value.trim())));
}

/* ---------- router ---------- */
function go(where){
  if (PRESET && !DEPTS.slice(1).includes(where)) where = "home";
  window.scrollTo(0, 0); setStatus("");
  if (where === "home") home(); else if (where === "pm") pmPage(); else if (where === "share") sharePage(); else deptPage(where);
  try { sessionStorage.setItem("cil_view", where); } catch {}
}
document.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b){ e.preventDefault(); go(b.dataset.go); } });
window.addEventListener("hashchange", () => location.reload());
const incoming = answersFromHash();
if (incoming){
  addToPM(incoming);
  try { history.replaceState(null, "", location.pathname); } catch {}
  pmPage(`<div class="banner ok">✓ Answers received from ${incoming.map(a => esc(NAMES[a.d]) + (a.by ? " (" + esc(a.by) + ")" : "")).join(", ")} for branch <b>${esc(incoming[0].branch || "")}</b>. Sections A & B are updated below.</div>`);
  try { sessionStorage.setItem("cil_view", "pm"); } catch {}
} else {
  let startView = "home"; try { startView = sessionStorage.getItem("cil_view") || "home"; } catch {}
  go(DEPTS.includes(startView) || startView === "pm" || startView === "share" ? startView : "home");
}
</script>
